services:
  - type: web
    name: task-assigned-api
    runtime: python
    plan: free
    buildCommand: >
      pip install -r requirements.txt &&
      python manage.py collectstatic --noinput &&
      python manage.py migrate
    startCommand: gunicorn gestion_intervention.wsgi:application
    envVars:
      # Django
      - key: DJANGO_SETTINGS_MODULE
        value: gestion_intervention.settings_production
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: task-assigned-api.onrender.com
      # Base de données (Neon) — remplir manuellement dans le dashboard
      # Render après avoir créé la base sur neon.tech (voir guide)
      - key: DB_NAME
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        value: "5432"
      - key: DB_SSLMODE
        value: require
      # CORS/CSRF — remplacer par le vrai domaine du front React une fois connu
      - key: CORS_ALLOWED_ORIGINS
        value: http://localhost:3000
      - key: CSRF_TRUSTED_ORIGINS
        value: https://task-assigned-api.onrender.com
      # Pas de Redis pour l'instant (dev/test mobile uniquement) : le code
      # retombe proprement sur un cache mémoire local si REDIS_URL est vide.
      - key: REDIS_URL
        value: ""
      # SMS : vide = mode simulation (code OTP visible dans les logs Render)
      - key: SMS_PROVIDER_URL
        value: ""
      - key: SMS_PROVIDER_API_KEY
        value: ""
      - key: SMS_SENDER_ID
        value: SEEG
      # Sécurité : Render fournit déjà HTTPS en frontal, mais le
      # SECURE_SSL_REDIRECT de Django est aussi activé par défaut en prod
      - key: SECURE_SSL_REDIRECT
        value: "True"
      - key: SESSION_COOKIE_SECURE
        value: "True"
      - key: CSRF_COOKIE_SECURE
        value: "True"
